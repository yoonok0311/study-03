<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상식 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <h1>상식 퀴즈</h1>
      <p class="subtitle">한국사 · 과학 · 지리 · 일반상식</p>

      <p class="field-label">게임 모드</p>
      <div id="mode-list" class="mode-list"></div>

      <div id="category-field" class="hidden">
        <label for="category-select">카테고리</label>
        <select id="category-select"></select>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="shuffle-check" checked>
        문제 순서 섞기
      </label>
      <button id="start-btn" class="primary">게임 시작</button>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <span id="progress-text"></span>
        <span id="timer-text" class="timer"></span>
        <span id="score-text"></span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div id="time-bar" class="time-bar hidden"><div id="time-fill"></div></div>

      <div class="quiz-toolbar">
        <div class="badges">
          <span id="question-category" class="badge"></span>
          <span id="question-difficulty" class="badge difficulty"></span>
          <span id="combo-badge" class="badge combo hidden"></span>
        </div>
        <div class="tools">
          <button id="hint-btn" class="tool" title="오답 2개 제거 (H)"></button>
          <button id="pause-btn" class="tool" title="일시정지 (P)">일시정지</button>
        </div>
      </div>

      <h2 id="question-text"></h2>
      <div id="options"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-title"></p>
        <p id="feedback-points"></p>
        <p id="feedback-explanation"></p>
      </div>
      <button id="next-btn" class="primary hidden">다음 문제</button>

      <div id="pause-overlay" class="pause-overlay hidden">
        <p class="pause-title">일시정지</p>
        <button id="resume-btn" class="primary">계속하기</button>
        <button id="quit-btn" class="secondary">그만하고 결과 보기</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="screen">
      <h1>게임 종료</h1>
      <p id="result-mode" class="subtitle"></p>
      <p id="result-score" class="result-score"></p>
      <p id="result-detail"></p>
      <div class="stats">
        <div class="stat"><span class="stat-value" id="stat-accuracy"></span><span class="stat-label">정답률</span></div>
        <div class="stat"><span class="stat-value" id="stat-time"></span><span class="stat-label">평균 응답 시간</span></div>
        <div class="stat"><span class="stat-value" id="stat-streak"></span><span class="stat-label">최장 연속 정답</span></div>
        <div class="stat"><span class="stat-value" id="stat-hints"></span><span class="stat-label">힌트 사용</span></div>
      </div>
      <table class="category-stats">
        <thead><tr><th>카테고리</th><th>정답</th><th>정답률</th></tr></thead>
        <tbody id="category-stats-body"></tbody>
      </table>
      <button id="restart-btn" class="primary">처음으로</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="score.js"></script>
  <script src="app.js"></script>
</body>
</html>
